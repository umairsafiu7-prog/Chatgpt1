<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f9fa">
<title>Universal AI Chat</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f9fa;color:#202124}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8f9fa;z-index:9999;font-size:18px}
.app{display:flex;min-height:100dvh;height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:280px;background:#f0f4f9;padding:16px;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s;z-index:20}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;height:100%;background:#f8f9fa}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;padding:0 18px;gap:12px}
.messages{flex:1;overflow-y:auto;padding:20px 16px 30px;scroll-behavior:smooth}
.message{max-width:850px;margin:20px auto;display:flex;gap:12px;align-items:flex-start}
.user{justify-content:flex-end}
.bubble{max-width:85%;padding:14px 18px;border-radius:20px;line-height:1.65;overflow-wrap:anywhere}
.user .bubble{background:#e3e8f0;border-radius:20px 20px 4px 20px}
.ai .bubble{background:transparent;width:100%;max-width:100%}
.input-area{padding:12px 16px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;background:#f8f9fa}
.input-box{max-width:850px;margin:auto;background:#edf2fa;border-radius:26px;padding:12px 15px;display:flex;align-items:flex-end;gap:10px;border:1px solid transparent}
.input-box:focus-within{border-color:#a8c7fa}
textarea{resize:none;outline:none;border:0;background:transparent;width:100%;max-height:150px;min-height:28px;font-size:16px;color:inherit}
button{cursor:pointer;border:0}
.icon-btn{padding:10px;border-radius:50%;background:transparent;font-size:18px}
.icon-btn:hover,.new-btn:hover{background:#e1e7f0}
.new-btn{padding:12px;border-radius:25px;background:#e3eaf5;text-align:left}
.chat-list{overflow-y:auto;margin-top:15px;flex:1}
.chat-item{padding:11px;border-radius:12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;margin-bottom:5px}
.chat-item.active,.chat-item:hover{background:#dce5f1}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:19}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0007;align-items:center;justify-content:center;padding:15px}
.modal-content{background:white;color:#202124;width:100%;max-width:470px;padding:24px;border-radius:22px;max-height:90dvh;overflow-y:auto}
.field{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:7px 0 15px;background:transparent;color:inherit}
.primary{background:#1a73e8;color:white;padding:11px 20px;border-radius:20px}
.secondary{background:#e8eaed;padding:11px 20px;border-radius:20px}
pre{background:#202124;color:#eee;padding:16px;border-radius:12px;overflow-x:auto;white-space:pre}
code{font-family:monospace;font-size:13px}
p code,li code{background:#e5e7eb;color:#333;padding:3px 5px;border-radius:5px}
pre code{background:none;color:inherit}
.ai .bubble p{margin:8px 0}
.ai .bubble h1,.ai .bubble h2,.ai .bubble h3{font-weight:bold;margin:16px 0 8px}
.ai .bubble ul,.ai .bubble ol{padding-left:25px;list-style:initial}
.ai .bubble a{color:#1a73e8;text-decoration:underline}
.typing{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin:3px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.dark body,.dark .main{background:#131314;color:#e3e3e3}
.dark .sidebar{background:#1e1f20}
.dark .new-btn,.dark .chat-item.active,.dark .chat-item:hover{background:#303134}
.dark .input-area{background:#131314}
.dark .input-box{background:#282a2c}
.dark .user .bubble{background:#303134}
.dark .modal-content{background:#282a2c;color:#eee}
.dark .field{border-color:#555}
.dark .secondary{background:#444;color:white}
.dark p code,.dark li code{background:#444;color:#eee}
@media(max-width:700px){
.sidebar{position:fixed;top:0;bottom:0;left:0;width:290px;transform:translateX(-105%);height:100dvh}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block}
.topbar{height:55px;padding:0 10px}
.messages{padding:12px 12px 20px}
.input-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.bubble{max-width:90%}
}
</style>
</head>

<body>
<div id="loading">Loading App...</div>

<div class="app">

<aside class="sidebar" id="sidebar">
<div class="flex justify-between items-center mb-5">
<h2 class="text-xl font-semibold">✦ Universal AI</h2>
<button class="icon-btn" onclick="toggleSidebar()">✕</button>
</div>

<button class="new-btn" onclick="newChat()">＋ New Chat</button>

<div class="chat-list" id="chatList"></div>

<div class="border-t border-gray-300 pt-3">
<button class="new-btn w-full mb-2" onclick="openSettings()">⚙ Settings</button>
<button class="new-btn w-full" onclick="toggleDark()">🌙 Dark Mode</button>
</div>
</aside>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<main class="main">
<header class="topbar">
<button class="icon-btn" onclick="toggleSidebar()">☰</button>
<h2 class="font-semibold text-lg">Universal AI</h2>
<div class="ml-auto flex gap-2">
<button class="icon-btn" onclick="editSystem()">🧠</button>
<button class="icon-btn" onclick="openSettings()">⚙</button>
</div>
</header>

<section class="messages" id="messages">
<div id="welcome" class="text-center mt-20">
<div class="text-5xl mb-5">✦</div>
<h1 class="text-3xl font-semibold mb-3">Hello, how can I help?</h1>
<p class="text-gray-500">Ask anything. Your AI assistant is ready.</p>
</div>
</section>

<div class="input-area">
<div class="input-box">
<textarea id="prompt" rows="1" placeholder="Ask anything..." onkeydown="handleKey(event)" oninput="resizeInput(this)"></textarea>
<button class="icon-btn" onclick="sendMessage()" id="sendBtn">➤</button>
</div>
<p class="text-center text-xs text-gray-500 mt-2">AI can make mistakes. Check important information.</p>
</div>
</main>
</div>

<!-- SETTINGS -->
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2 class="text-xl font-semibold mb-4">⚙ Settings</h2>

<label class="font-medium">OpenRouter API Key</label>
<input class="field" id="apiKey" type="password" placeholder="sk-or-v1-...">

<label class="font-medium">Model Name</label>
<input class="field" id="modelName" type="text" placeholder="deepseek/deepseek-r1:free">

<p class="text-sm text-gray-500 mb-4">
Example models:
<br>deepseek/deepseek-r1:free
<br>openai/gpt-4o-mini
<br>google/gemini-2.0-flash-exp:free
</p>

<div class="flex justify-between">
<button class="secondary" onclick="closeModal('settingsModal')">Cancel</button>
<button class="primary" onclick="saveSettings()">Save Settings</button>
</div>
</div>
</div>

<!-- SYSTEM PROMPT -->
<div class="modal" id="systemModal">
<div class="modal-content">
<h2 class="text-xl font-semibold mb-3">🧠 System Prompt</h2>
<textarea id="systemPrompt" class="field" rows="7" placeholder="You are a helpful AI assistant..."></textarea>
<div class="flex justify-between">
<button class="secondary" onclick="closeModal('systemModal')">Cancel</button>
<button class="primary" onclick="saveSystem()">Save</button>
</div>
</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const STORAGE = {
key:"universal_api_key",
model:"universal_model",
chats:"universal_chats",
dark:"universal_dark",
system:"universal_system"
};

let apiKey = localStorage.getItem(STORAGE.key) || "";
let model = localStorage.getItem(STORAGE.model) || "deepseek/deepseek-r1:free";
let systemPrompt = localStorage.getItem(STORAGE.system) || "You are a helpful AI assistant.";
let chats = [];
let currentChat = null;
let busy = false;
let controller = null;

try {
chats = JSON.parse(localStorage.getItem(STORAGE.chats) || "[]");
if (!Array.isArray(chats)) chats = [];
} catch(e) { chats = []; }

function saveChats(){
try{
localStorage.setItem(STORAGE.chats,JSON.stringify(chats));
}catch(e){
console.error("Could not save chats:",e);
}
}

function createChat(){
return {
id:Date.now().toString()+Math.random().toString(36).slice(2,7),
title:"New Chat",
messages:[],
system:systemPrompt
};
}

function newChat(){
if(busy) return;
const chat=createChat();
chats.unshift(chat);
currentChat=chat.id;
saveChats();
renderChats();
renderMessages();
closeSidebarMobile();
}

function getChat(){
return chats.find(c=>c.id===currentChat)||null;
}

function renderChats(){
const list=$("chatList");
list.innerHTML="";

chats.forEach(chat=>{
const row=document.createElement("div");
row.className="chat-item"+(chat.id===currentChat?" active":"");

const title=document.createElement("span");
title.className="chat-title";
title.textContent=chat.title||"New Chat";
title.onclick=()=>{
if(busy)return;
currentChat=chat.id;
renderChats();
renderMessages();
closeSidebarMobile();
};

const menu=document.createElement("button");
menu.textContent="⋮";
menu.className="icon-btn";
menu.onclick=e=>{
e.stopPropagation();
const action=prompt("Type: rename or delete");
if(action==="rename"){
const name=prompt("New chat name:",chat.title);
if(name&&name.trim()){
chat.title=name.trim();
saveChats();
renderChats();
}
}else if(action==="delete"){
if(confirm("Delete this chat?")){
chats=chats.filter(c=>c.id!==chat.id);
if(currentChat===chat.id){
currentChat=null;
if(chats.length) currentChat=chats[0].id;
else{
const fresh=createChat();
chats.push(fresh);
currentChat=fresh.id;
}
}
saveChats();
renderChats();
renderMessages();
}
}
};

row.append(title,menu);
list.appendChild(row);
});
}

function renderMessages(){
const area=$("messages");
area.innerHTML="";
const chat=getChat();

if(!chat||!chat.messages.length){
area.innerHTML=`
<div class="text-center mt-20">
<div class="text-5xl mb-5">✦</div>
<h1 class="text-3xl font-semibold mb-3">Hello, how can I help?</h1>
<p class="text-gray-500">Ask anything. Your AI assistant is ready.</p>
</div>`;
return;
}

chat.messages.forEach(msg=>addMessageElement(msg.role,msg.content,false));
area.scrollTop=area.scrollHeight;
}

function addMessageElement(role,content,scroll=true){
const area=$("messages");
const wrapper=document.createElement("div");
wrapper.className="message "+(role==="user"?"user":"ai");

const bubble=document.createElement("div");
bubble.className="bubble";

if(role==="user"){
bubble.textContent=content;
}else{
bubble.innerHTML=renderMarkdown(content);
}

wrapper.appendChild(bubble);
area.appendChild(wrapper);

if(scroll) area.scrollTop=area.scrollHeight;
return bubble;
}

function renderMarkdown(text){
try{
if(window.marked&&window.DOMPurify){
return DOMPurify.sanitize(marked.parse(text||""));
}
}catch(e){}
const div=document.createElement("div");
div.textContent=text||"";
return div.innerHTML.replace(/\n/g,"<br>");
}

function handleKey(e){
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
}

function resizeInput(el){
el.style.height="auto";
el.style.height=Math.min(el.scrollHeight,150)+"px";
}

async function sendMessage(){
if(busy)return;

const input=$("prompt");
const text=input.value.trim();
if(!text)return;

if(!apiKey){
openSettings();
alert("Please enter your OpenRouter API Key first.");
return;
}

if(!currentChat){
const chat=createChat();
chats.unshift(chat);
currentChat=chat.id;
}

const chat=getChat();
if(!chat)return;

input.value="";
input.style.height="auto";

if(chat.messages.length===0){
chat.title=text.slice(0,35);
}

chat.messages.push({role:"user",content:text});
addMessageElement("user",text);

const aiBubble=addMessageElement("assistant","");

const messages=[
{role:"system",content:chat.system||systemPrompt},
...chat.messages.map(m=>({
role:m.role==="assistant"?"assistant":"user",
content:m.content
}))
];

busy=true;
$("sendBtn").textContent="■";
renderChats();

controller=new AbortController();

let fullText="";
let buffer="";

try{
const response=await fetch("https://openrouter.ai/api/v1/chat/completions",{
method:"POST",
headers:{
"Authorization":"Bearer "+apiKey,
"Content-Type":"application/json",
"HTTP-Referer":location.origin,
"X-Title":"Universal AI Chat"
},
body:JSON.stringify({
model:model,
messages:messages,
stream:true
}),
signal:controller.signal
});

if(!response.ok){
const err=await response.text();
throw new Error("API Error "+response.status+": "+err.slice(0,500));
}

if(!response.body)throw new Error("Streaming is not supported by this browser.");

const reader=response.body.getReader();
const decoder=new TextDecoder();
let streamBuffer="";

while(true){
const {done,value}=await reader.read();
if(done)break;

streamBuffer+=decoder.decode(value,{stream:true});
const lines=streamBuffer.split("\n");
streamBuffer=lines.pop()||"";

for(const line of lines){
const trimmed=line.trim();
if(!trimmed.startsWith("data:"))continue;

const data=trimmed.slice(5).trim();
if(data==="[DONE]")continue;

try{
const json=JSON.parse(data);
const token=json.choices?.[0]?.delta?.content;

if(typeof token==="string"){
fullText+=token;
buffer+=token;

aiBubble.innerHTML=renderMarkdown(fullText);
$("messages").scrollTop=$("messages").scrollHeight;
}
}catch(e){
console.warn("Stream parsing warning:",e);
}
}
}

if(streamBuffer.trim().startsWith("data:")){
try{
const json=JSON.parse(streamBuffer.trim().slice(5).trim());
const token=json.choices?.[0]?.delta?.content;
if(typeof token==="string"){
fullText+=token;
}
}catch(e){}
}

if(!fullText)fullText="No response received from the model.";

chat.messages.push({role:"assistant",content:fullText});
saveChats();

}catch(error){
if(error.name==="AbortError"){
if(fullText){
chat.messages.push({role:"assistant",content:fullText});
saveChats();
}
}else{
console.error(error);
aiBubble.textContent="⚠ "+error.message;
}

}catch(e){
console.error(e);
aiBubble.textContent="An unexpected error occurred.";
}finally{
busy=false;
controller=null;
$("sendBtn").textContent="➤";
saveChats();
renderChats();
$("messages").scrollTop=$("messages").scrollHeight;
}
}

function stopGeneration(){
if(controller)controller.abort();
}

function openSettings(){
$("apiKey").value=apiKey;
$("modelName").value=model;
$("settingsModal").style.display="flex";
}

function saveSettings(){
apiKey=$("apiKey").value.trim();
model=$("modelName").value.trim()||"deepseek/deepseek-r1:free";

localStorage.setItem(STORAGE.key,apiKey);
localStorage.setItem(STORAGE.model,model);

closeModal("settingsModal");
alert("Settings saved successfully!");
}

function editSystem(){
const chat=getChat();
$("systemPrompt").value=chat?(chat.system||systemPrompt):systemPrompt;
$("systemModal").style.display="flex";
}

function saveSystem(){
systemPrompt=$("systemPrompt").value.trim()||"You are a helpful AI assistant.";
localStorage.setItem(STORAGE.system,systemPrompt);

const chat=getChat();
if(chat){
chat.system=systemPrompt;
saveChats();
}

closeModal("systemModal");
}

function closeModal(id){
$(id).style.display="none";
}

function toggleDark(){
document.documentElement.classList.toggle("dark");
localStorage.setItem(STORAGE.dark,
document.documentElement.classList.contains("dark")?"1":"0");
}

function toggleSidebar(){
$("sidebar").classList.toggle("open");
$("overlay").classList.toggle("show");
}

function closeSidebarMobile(){
$("sidebar").classList.remove("open");
$("overlay").classList.remove("show");
}

window.addEventListener("resize",()=>{
if(window.innerWidth>700)closeSidebarMobile();
});

function initialize(){
if(localStorage.getItem(STORAGE.dark)==="1"){
document.documentElement.classList.add("dark");
}

if(!chats.length){
const chat=createChat();
chats.push(chat);
currentChat=chat.id;
}else{
currentChat=chats[0].id;
}

renderChats();
renderMessages();

$("loading").style.display="none";
}

try{
initialize();
}catch(e){
console.error("Initialization error:",e);
$("loading").textContent="App initialization failed. Please refresh.";
}
</script>
</body>
</html>
